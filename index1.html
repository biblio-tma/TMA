<!DOCTYPE HTML>
<HTML lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Contactez-nous</title>
        <link rel="stylesheet" href="stylee.css">
    </head>
    <header> Contactez-nous</header>
    <body>
        <div class="forms">
        <div id="form">
        <form>
            <input type="text" name="user_name" placeholder="votre nom", required>
            <input type="email" name="user_email" placeholder="entrez votre e-mail", required>
            <textarea name="message" placeholder="Message", required></textarea>
            <P align="center" ><button type="submit"> Envoyer</button></P>
        </form>
        <p id="message"></p>
        </div>
    </div>
<P align="right" ><button onclick="window.location.href='index.html';">🏠 Retour à l’accueil</button></P>
<footer>© 2025 Bibliothèque TMA | Tous droits réservés.</footer>
<script src="https://cdn.emailjs.com/dist/email.min.js"></script>
<script>
    (function() {
        emailjs.init("DD7LWH3oU2c_250E8");
    })();
    document.getElementById('form').addEventListener('submit', function(e) {
        e.preventDefault();
        emailjs.sendForm('service_auriol', 'template_auriol', this)
        .then(function() {
            document.getElementById('status').textContent = "Message envoye avec succes !";
        }, function(error) {
            document.getElementById('status').textContent = "Erreur, veuillez ressayez.";
            console.error(error);
        });
        this.reset();
        });
</script>
    </body>
</HTML>
